name: Founder balance smoke
on:
  pull_request:
    paths:
      - web/game-balance-smoke.mjs
      - web/simulation.js
      - web/founder-designer.js
      - web/founder-presets.js
      - .github/workflows/game-balance-smoke.yml
jobs:
  compare-founders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare four founder strategies across six seeds
        run: node web/game-balance-smoke.mjs
