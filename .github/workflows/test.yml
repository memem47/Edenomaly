name: Node tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Headless smoke test (two reproducible seeds)
        run: npm run headless -- --seed 72 --steps 300 --runs 2 --interval 50 --out results/ci-headless
      - name: Audit natural species names with fast simulation
        run: npm run name-audit -- --seed 72 --steps 1200 --runs 4
      - name: Upload headless baseline results
        uses: actions/upload-artifact@v4
        with:
          name: edenomaly-headless-baseline
          path: results/ci-headless/
          retention-days: 7
